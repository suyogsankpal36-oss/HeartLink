[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  VITE_API_URL = "https://heartlink-api-36vt.onrender.com/api/v1"
  VITE_SOCKET_URL = "https://heartlink-api-36vt.onrender.com"
  # Vite intentionally embeds these public service origins in the browser bundle.
  # They are endpoints, not credentials; retaining this allow-list prevents
  # Netlify's secret scanner from rejecting a valid frontend build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_SOCKET_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
