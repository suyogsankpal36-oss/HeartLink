<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1B1720" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8DCE5" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="HeartLink — Where Hearts Find Their Connection. Discover, Connect, Match, Love." />
    <title>HeartLink — Online Dating, Made Elegant</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hl_admin_theme") || "dark";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = stored === "system" ? (prefersDark ? "dark" : "light") : (stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light"));
          var root = document.documentElement;
          root.setAttribute("data-theme", resolved);
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) csMeta.setAttribute("content", stored === "system" ? "light dark" : resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-base-200 text-base-content">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
